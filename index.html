<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
      content="width=device-width, initial-scale=1.0">

    <title>College Registration</title>
    <link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
}


body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}


.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 20px;
}


.container.wide {
    max-width: 1100px;
}


.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}


h1 {
    text-align: center;
    margin-top: 0;
}


.subtitle {
    text-align: center;
    color: #666;
}


label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}


input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


textarea {
    resize: vertical;
}


.btn {
    display: inline-block;
    border: none;
    background: #1565c0;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    margin-top: 20px;
    cursor: pointer;
    text-decoration: none;
    font-size: 16px;
}


.btn:hover {
    background: #0d47a1;
}


#message {
    margin-top: 20px;
}


.success {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}


.error {
    background: #ffebee;
    color: #b71c1c;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}


.links {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 25px;
    flex-wrap: wrap;
}


.links a,
.back {
    color: #1565c0;
    text-decoration: none;
}


.student-card {
    margin-top: 25px;
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
}


.status {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 18px;
    background: #fff3cd;
    border-radius: 20px;
    font-weight: bold;
}


.table-container {
    overflow-x: auto;
    margin-top: 20px;
}


table {
    width: 100%;
    border-collapse: collapse;
}


th,
td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: left;
}


th {
    background: #f1f1f1;
}


.receipt-page {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}


.receipt {
    background: white;
    padding: 35px;
    border: 1px solid #ddd;
}


.receipt h1,
.receipt h3 {
    text-align: center;
}


.receipt-row {
    display: flex;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}


.receipt-row strong {
    min-width: 180px;
}


.receipt-status {
    margin-top: 25px;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    border: 2px solid #222;
}


.signature {
    margin-top: 70px;
    text-align: right;
}


@media print {

    body {
        background: white;
    }


    .no-print {
        display: none !important;
    }


    .receipt-page {
        padding: 0;
        max-width: none;
    }


    .receipt {
        border: none;
        box-shadow: none;
    }

}


@media (max-width: 600px) {

    .container {
        padding: 10px;
    }


    .card {
        padding: 18px;
    }


    .receipt {
        padding: 20px;
    }


    .receipt-row {
        flex-direction: column;
        gap: 5px;
    }


    .receipt-row strong {
        min-width: 0;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>College Registration</h1>

        <p class="subtitle">
            Student Registration Form
        </p>


        <form id="registrationForm">


            <label>
                Student Name *
            </label>

            <input
                type="text"
                id="name"
                required
            >


            <label>
                Father's Name *
            </label>

            <input
                type="text"
                id="father"
                required
            >


            <label>
                Mobile Number *
            </label>

            <input
                type="tel"
                id="mobile"
                required
                maxlength="10"
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
            >


            <label>
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
            >


            <label>
                Gender
            </label>

            <select id="gender">

                <option value="">
                    Select
                </option>

                <option>
                    Male
                </option>

                <option>
                    Female
                </option>

                <option>
                    Other
                </option>

            </select>


            <label>
                Course *
            </label>

            <select
                id="course"
                required
            >

                <option value="">
                    Select Course
                </option>

                <option>
                    BCA
                </option>

                <option>
                    BBA
                </option>

                <option>
                    BSc
                </option>

                <option>
                    BA
                </option>

                <option>
                    BCom
                </option>

                <option>
                    MA
                </option>

                <option>
                    MSc
                </option>

            </select>


            <label>
                Address
            </label>

            <textarea
                id="address"
                rows="4"
            ></textarea>


            <button
                type="submit"
                class="btn"
            >
                Register Student
            </button>

        </form>


        <div id="message"></div>


        <div class="links">

            <a href="status.html">
                Check Student Status
            </a>

           <a href="admin.html">
             Admin
           </a>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>

</html>
