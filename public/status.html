<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Status</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">

    <div class="card">

        <h1>Student Status</h1>

        <p>
            Enter your registration number
        </p>


        <input
            type="text"
            id="registrationNo"
            placeholder="COL-2026-00001"
        >


        <button
            class="btn"
            onclick="findStudent()"
        >
            Check Status
        </button>


        <div id="result"></div>


        <a
            class="back"
            href="index.html"
        >
            ← Registration
        </a>

    </div>

</div>


<script src="app.js"></script>

</body>

</html>
